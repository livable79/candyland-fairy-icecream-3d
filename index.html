<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fairy Candyland</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <h1>Fairy Candyland</h1>
        <div class="stats">
          <span>Ice creams: <strong id="score">0</strong>/8</span>
          <span>Fairies: <strong id="fairy-count">3</strong></span>
        </div>
      </div>
    </div>

    <div id="message" class="message">Collect all the glowing ice creams! Use WASD to move.</div>

    <script type="module" src="game.js"></script>
  </body>
</html>
